name: WFH Canonical DR Restore v2

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact encrypted DR release tag
        required: true
        type: string
  repository_dispatch:
    types:
      - wfh_dr_restore_verify

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact DR harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned restore dependencies
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-restore.lock'

      - name: Download and verify encrypted restore
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.client_payload.release_tag }}
          WFH_DR_AES256_KEY_B64: ${{ secrets.WFH_DR_AES256_KEY_B64 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^wfh-production-dr-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{40}$ ]]
          install -d -m 0700 restore-work
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir restore-work
          python restore_release_backup.py \
            --manifest "$GITHUB_WORKSPACE/restore-work/waterfall_registry.manifest.json" \
            --bundle-dir "$GITHUB_WORKSPACE/restore-work" \
            --output "$GITHUB_WORKSPACE/restore-work/waterfall_registry.db" \
            > "$GITHUB_WORKSPACE/restore-work/restore-report.json"
          jq -e '.ok == true and .status == "RESTORE_VERIFIED"' restore-work/restore-report.json >/dev/null

      - name: Upload restore verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-verification-${{ github.run_id }}
          path: restore-work/restore-report.json
          retention-days: 7
          if-no-files-found: error